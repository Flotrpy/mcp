name: Release

# Push a tag like v0.1.0 to build all five servers for every platform and
# attach them, with checksums, to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-14, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-13, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=mcp-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$dir"
          for s in joinery binscope lighthouse vitals handset; do
            cp "target/${{ matrix.target }}/release/$s-mcp${{ matrix.ext }}" "$dir/"
          done
          cp LICENSE README.md "$dir/"
          if [ "${{ matrix.ext }}" = ".exe" ]; then 7z a "$dir.zip" "$dir" >/dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mcp-*.*z*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum mcp-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mcp-*
            SHA256SUMS
          generate_release_notes: true
